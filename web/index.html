<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>durable</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f8f7f4;
  --bg-elevated: #ffffff;
  --fg: #141413;
  --fg-secondary: #6b6962;
  --border: #e4e2dc;
  --border-strong: #d4d1c9;
  --success: #3d6b52;
  --warning: #8a6b2e;
  --error: #9b4438;
  --running: #3d5f7a;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sidebar-w: 200px;
  --header-h: 48px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 4px;
  --radius-md: 6px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}

.app-header {
  flex: none;
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-4);
  padding-inline: var(--space-5);
  border-bottom: 1px solid var(--border);
  background: var(--bg-elevated);
}

.header-search {
  flex: 1;
  max-width: 280px;
  margin-right: auto;
}

.header-search input {
  width: 100%;
  font-family: var(--sans);
  font-size: 13px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg);
  color: var(--fg);
  outline: none;
  transition: border-color 0.15s ease;
}

.header-search input::placeholder {
  color: var(--fg-secondary);
}

.header-search input:focus {
  border-color: var(--border-strong);
}

.connection {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--fg-secondary);
  user-select: none;
}

.connection .dot {
  font-size: 10px;
  line-height: 1;
}

.connection.is-connected {
  color: var(--success);
}

.connection.is-disconnected {
  color: var(--error);
}

.app-body {
  display: flex;
  flex: 1;
  min-height: 0;
}

.sidebar {
  flex: none;
  width: var(--sidebar-w);
  padding: var(--space-5) var(--space-4);
  border-right: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.wordmark {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--fg);
  padding-inline: var(--space-2);
  margin: 0;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-item {
  margin: 0;
}

.nav-link {
  display: block;
  width: 100%;
  text-align: left;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-secondary);
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  padding: 6px var(--space-2);
  cursor: pointer;
  transition: color 0.12s ease, background 0.12s ease;
}

.nav-link:hover {
  color: var(--fg);
  background: rgba(20, 20, 19, 0.04);
}

.nav-link[aria-current="page"] {
  color: var(--fg);
  background: rgba(20, 20, 19, 0.06);
}

.main {
  flex: 1;
  min-width: 0;
  padding: var(--space-6) var(--space-6) var(--space-5);
  overflow: auto;
}

.main-section {
  display: none;
  max-width: 960px;
}

.main-section.is-active {
  display: block;
}

.section-title {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 var(--space-2);
}

.placeholder-block {
  padding-top: var(--space-5);
  border-top: 1px solid var(--border);
}

.placeholder-text {
  font-size: 13px;
  color: var(--fg-secondary);
  margin: 0;
  line-height: 1.6;
}

@media (max-width: 720px) {
  :root {
    --sidebar-w: 100%;
  }

  .app-body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-right: none;
    border-bottom: 1px solid var(--border);
  }

  .nav {
    flex-direction: row;
    flex-wrap: wrap;
    flex: 1;
  }

  .main {
    padding: var(--space-5) var(--space-4);
  }

  .header-search {
    max-width: none;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-search">
      <input type="search" placeholder="Search" aria-label="Search" disabled>
    </div>
    <div class="connection is-disconnected" id="connection" aria-live="polite">
      <span class="dot" aria-hidden="true">●</span>
      <span id="connectionLabel">Checking…</span>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" aria-label="Primary">
      <h1 class="wordmark">durable</h1>
      <nav>
        <ul class="nav" role="list">
          <li class="nav-item">
            <button type="button" class="nav-link" data-section="workflows" aria-current="page">Workflows</button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-section="observability">Observability</button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-section="evaluations">Evaluations</button>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main" id="main">
      <section class="main-section is-active" id="section-workflows" aria-labelledby="title-workflows">
        <h2 class="section-title" id="title-workflows">Workflows</h2>
        <div class="placeholder-block">
          <p class="placeholder-text">Workflow list and filters.</p>
        </div>
      </section>

      <section class="main-section" id="section-observability" aria-labelledby="title-observability" hidden>
        <h2 class="section-title" id="title-observability">Observability</h2>
        <div class="placeholder-block">
          <p class="placeholder-text">Traces and Respan links.</p>
        </div>
      </section>

      <section class="main-section" id="section-evaluations" aria-labelledby="title-evaluations" hidden>
        <h2 class="section-title" id="title-evaluations">Evaluations</h2>
        <div class="placeholder-block">
          <p class="placeholder-text">Runs, scores, and failed cases.</p>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
(function () {
  var CONNECTION_INTERVAL_MS = 12000;
  var connectionEl = document.getElementById('connection');
  var connectionLabel = document.getElementById('connectionLabel');
  var navLinks = document.querySelectorAll('.nav-link[data-section]');
  var sections = {
    workflows: document.getElementById('section-workflows'),
    observability: document.getElementById('section-observability'),
    evaluations: document.getElementById('section-evaluations')
  };

  function setConnection(connected) {
    connectionEl.classList.toggle('is-connected', connected);
    connectionEl.classList.toggle('is-disconnected', !connected);
    connectionLabel.textContent = connected ? 'Connected' : 'Disconnected';
  }

  function checkConnection() {
    fetch('/metrics')
      .then(function (r) {
        if (!r.ok) throw new Error('metrics');
        return r.json();
      })
      .then(function () {
        setConnection(true);
      })
      .catch(function () {
        setConnection(false);
      });
  }

  function showSection(name) {
    Object.keys(sections).forEach(function (key) {
      var el = sections[key];
      var active = key === name;
      el.classList.toggle('is-active', active);
      el.hidden = !active;
    });
    navLinks.forEach(function (link) {
      var on = link.getAttribute('data-section') === name;
      if (on) {
        link.setAttribute('aria-current', 'page');
      } else {
        link.removeAttribute('aria-current');
      }
    });
  }

  navLinks.forEach(function (link) {
    link.addEventListener('click', function () {
      showSection(link.getAttribute('data-section'));
    });
  });

  checkConnection();
  setInterval(checkConnection, CONNECTION_INTERVAL_MS);
})();
</script>
</body>
</html>
