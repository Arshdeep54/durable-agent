[package]
name = "durable-agent"
version = "0.1.0"
edition = "2024"

[features]
dev-tools = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
agentq = { version = "0.2.1", features = ["sqlite"] }
async-openai = { version = "0.42.1", features = ["chat-completion"] }
axum = "0.8.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = "0.5.3"
