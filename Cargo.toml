[package]
name = "durable-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.42.1", features = ["chat-completion"] }
axum = "0.8.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = "0.5.3"
